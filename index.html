<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bryce McPherson for Vice President</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #081c38;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
      }
      .poster-frame {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #081c38;
      }
      .poster-frame img {
        display: block;
        width: min(100vw, 1100px);
        height: auto;
        max-height: 100vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="poster-frame">
      <img src="poster.svg" alt="Bryce McPherson for 6th Grade Vice President campaign poster" />
    </div>
  </body>
</html>
