<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bryce McPherson | Vice President</title>
    <meta name="description" content="Bryce McPherson for 6th Grade Vice President — Your voice matters." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="campaign-page">
      <section class="hero-area">
        <div class="hero-splash hero-splash-left"></div>
        <div class="hero-splash hero-splash-right"></div>

        <div class="hero-content">
          <div class="portrait-wrap" aria-label="Bryce McPherson portrait illustration">
            <div class="portrait">
              <div class="head-glow"></div>
              <div class="hair"></div>
              <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>
                <span class="smile"></span>
              </div>
              <div class="neck"></div>
              <div class="body-shirt"></div>
              <div class="arm arm-left"></div>
              <div class="arm arm-right"></div>
              <div class="hand hand-right"></div>
              <div class="bug bug-left"></div>
              <div class="bug bug-right"></div>
            </div>
          </div>

          <div class="headline-block">
            <h1>
              <span class="line line-1">YOUR</span>
              <span class="line line-2">VOICE</span>
              <span class="line line-3">MATTERS!</span>
            </h1>

            <div class="pledge-list" aria-label="Bryce McPherson campaign values">
              <div class="check-row"><span class="checkmark"></span><span>LISTEN</span></div>
              <div class="check-row"><span class="checkmark"></span><span>SUPPORT</span></div>
              <div class="check-row"><span class="checkmark"></span><span>REPRESENT</span></div>
              <div class="check-row"><span class="checkmark"></span><span>TAKE ACTION</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="name-banner" aria-label="Bryce McPherson for 6th grade vice president">
        <div class="name-title">BRYCE MCPHERSON</div>
        <div class="sub-title">FOR 6TH GRADE VICE PRESIDENT</div>
      </section>

      <section class="value-grid" aria-label="Campaign strengths">
        <article class="value-card">
          <div class="icon-wrap people" aria-hidden="true">
            <span class="person person-left"></span>
            <span class="person person-right"></span>
            <span class="person-body"></span>
          </div>
          <h2>STRONGER<br />STUDENTS</h2>
        </article>

        <article class="value-card">
          <div class="icon-wrap bulb" aria-hidden="true">
            <span class="bulb-glow"></span>
            <span class="bulb-base"></span>
          </div>
          <h2>BIGGER<br />IDEAS</h2>
        </article>

        <article class="value-card">
          <div class="icon-wrap community" aria-hidden="true">
            <span class="hand-arc hand-left"></span>
            <span class="hand-arc hand-right"></span>
            <span class="person-dot dot-left"></span>
            <span class="person-dot dot-right"></span>
          </div>
          <h2>BETTER<br />COMMUNITY</h2>
        </article>

        <article class="value-card">
          <div class="icon-wrap trophy" aria-hidden="true">
            <span class="trophy-top"></span>
            <span class="trophy-body"></span>
            <span class="trophy-base"></span>
          </div>
          <h2>BRIGHTER<br />TOMORROW</h2>
        </article>
      </section>
    </main>
  </body>
</html>
